services:
  - type: web
    name: personal-portfolio-studio
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: portfolio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAX_UPLOAD_MB
        value: 100
